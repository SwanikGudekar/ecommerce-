
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Engineering Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
        }


        header h1 {
            margin: 0;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h2 {
            margin-top: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 50%;
            margin: 0 auto;
        }

        label {
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"] {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        input[type="submit"] {
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #444;
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>
<head>
    <meta charset="UTF-8">

        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-light">

                </a>

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

</html>
            <div class="container">
                <h2>Payment Information</h2>
                <form>
                    <label for="card-number">Card Number:</label>
                    <input type="text" id="card-number" name="card-number" required>
        
                    <label for="card-holder">Card Holder:</label>
                    <input type="text" id="card-holder" name="card-holder" required>
        
                    <label for="expiration-date">Expiration Date:</label>
                    <input type="text" id="expiration-date" name="expiration-date" placeholder="MM/YY" required>
        
                    <label for="address">Address:</label>
                    <input type="text" id="cvv" name="adresss" required>
        
                    <input type="submit" value="Submit Payment">
                </form>
            </div>
        </main>
    </main>
